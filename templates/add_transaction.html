{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <div>
        <h1 class="h2 fw-bold" id="page_heading"><i class="fas fa-money-bill-wave text-success me-2"></i>Record Customer Payment</h1>
        <p class="text-muted small mb-0" id="page_subheading">Directly record a payment received from a customer without requiring an invoice.</p>
    </div>
    <div class="btn-group shadow-sm rounded-pill p-1 bg-body-secondary" role="group" aria-label="Transaction Type">
        <input type="radio" class="btn-check" name="tx_mode" id="mode_payment" value="payment" checked onchange="switchTransactionMode('payment')">
        <label class="btn btn-sm btn-outline-primary rounded-pill px-3 fw-semibold border-0" for="mode_payment">
            <i class="fas fa-hand-holding-dollar me-1"></i> Receive Payment
        </label>
        
        <input type="radio" class="btn-check" name="tx_mode" id="mode_invoice" value="invoice" onchange="switchTransactionMode('invoice')">
        <label class="btn btn-sm btn-outline-primary rounded-pill px-3 fw-semibold border-0" for="mode_invoice">
            <i class="fas fa-file-invoice me-1"></i> New Invoice
        </label>
    </div>
</div>

<div class="card shadow-sm border-0 rounded-4 mb-4">
    <div class="card-body p-4">
        <form method="POST" action="{{ url_for('routes.add_transaction') }}" id="tx_form">
            
            <!-- Customer Section -->
            <div class="row mb-3">
                <div class="col-md-6 mb-3">
                    <label for="customer_name" class="form-label fw-semibold">Customer <span class="text-danger">*</span></label>
                    <select class="form-select rounded-3" id="customer_name" name="customer_name" required onchange="handleCustomerChange(this.value)">
                        <option value="">Select a customer...</option>
                        {% for customer in customers %}
                        <option value="{{ customer.name }}">{{ customer.name }}</option>
                        {% endfor %}
                        <option value="___OTHER___">+ Add New Customer</option>
                    </select>
                    <div id="new_customer_name_div" class="mt-2" style="display: none;">
                        <input type="text" class="form-control rounded-3" id="new_customer_name" name="new_customer_name" placeholder="Enter new customer name">
                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="date" class="form-label fw-semibold">Date <span class="text-danger">*</span></label>
                    <input type="date" class="form-control rounded-3" id="date" name="date" required value="{{ current_date }}">
                </div>
            </div>

            <!-- Payment Mode: Amount & Method Fields -->
            <div id="payment_fields_section">
                <div class="row mb-3">
                    <div class="col-md-6 mb-3">
                        <label for="payment_amount" class="form-label fw-semibold text-success"><i class="fas fa-coins me-1"></i>Payment Amount (AED) <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" min="0.01" class="form-control form-control-lg rounded-3 font-monospace fw-bold" id="payment_amount" name="payment_amount" placeholder="0.00" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="payment_type_id" class="form-label fw-semibold">Payment Method</label>
                        <select class="form-select rounded-3" id="payment_type_id" name="payment_type_id">
                            <option value="">Select payment method...</option>
                            {% for pt in payment_types %}
                            <option value="{{ pt.id }}" {% if loop.first %}selected{% endif %}>{{ pt.type_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6 mb-3">
                        <label for="bank_account_id" class="form-label fw-semibold">Bank Account</label>
                        <select class="form-select rounded-3" id="bank_account_id" name="bank_account_id">
                            <option value="">None / Cash in Hand</option>
                            {% for b in bank_accounts %}
                            <option value="{{ b.id }}" {% if loop.first %}selected{% endif %}>{{ b.account_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="invoice_number_pay" class="form-label fw-semibold text-muted">Invoice / Reference <span class="badge bg-light text-secondary border ms-1">Optional</span></label>
                        <input type="text" class="form-control rounded-3" id="invoice_number_pay" placeholder="e.g. INV-001, Cheque #, or leave blank" oninput="syncInvoiceNumber(this.value)">
                        <div id="invoice_feedback_pay" class="form-text text-info small mt-1" style="display: none;"></div>
                    </div>
                </div>
            </div>

            <!-- Invoice Mode: Specific Invoice Fields -->
            <div id="invoice_fields_section" style="display: none;">
                <div class="row mb-3">
                    <div class="col-md-6 mb-3">
                        <label for="invoice_number_inv" class="form-label fw-semibold text-primary"><i class="fas fa-hashtag me-1"></i>Invoice Number <span class="text-danger">*</span></label>
                        <input type="text" class="form-control rounded-3" id="invoice_number_inv" placeholder="e.g. SI-25-01-100" oninput="syncInvoiceNumber(this.value)">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="salesperson_name" class="form-label fw-semibold">Salesperson</label>
                        <select class="form-select rounded-3" id="salesperson_name" name="salesperson_name" onchange="handleSalespersonChange(this.value)">
                            <option value="">Select a salesperson...</option>
                            {% for salesperson in salespersons %}
                            <option value="{{ salesperson.name }}">{{ salesperson.name }}</option>
                            {% endfor %}
                            <option value="___OTHER___">+ Add New Salesperson</option>
                        </select>
                        <div id="new_salesperson_name_div" class="mt-2" style="display: none;">
                            <input type="text" class="form-control rounded-3" id="new_salesperson_name" name="new_salesperson_name" placeholder="Enter new salesperson name">
                        </div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6 mb-3">
                        <label for="invoice_amount" class="form-label fw-semibold text-primary"><i class="fas fa-file-invoice-dollar me-1"></i>Invoice Amount (AED) <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" min="0" class="form-control form-control-lg rounded-3 font-monospace fw-bold" id="invoice_amount" name="invoice_amount" value="0.00">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="initial_payment_amount" class="form-label fw-semibold">Initial Payment Received (AED)</label>
                        <input type="number" step="0.01" min="0" class="form-control rounded-3 font-monospace" id="initial_payment_amount" value="0.00" placeholder="0.00" oninput="syncInvoicePaymentAmount(this.value)">
                        <div class="form-text text-muted small">Enter an amount if the customer paid immediately at the time of sale.</div>
                    </div>
                </div>
            </div>

            <!-- Shared: Real Hidden/Routed Fields for backend submission -->
            <input type="hidden" id="invoice_number" name="invoice_number" value="">

            <div class="mb-4">
                <label for="remark_type" class="form-label fw-semibold">Remark / Notes</label>
                <div class="row g-2">
                    <div class="col-md-4">
                        <select class="form-select rounded-3" id="remark_type" name="remark_type" onchange="toggleRemarkCustom(this.value)">
                            <option value="Payment" selected>Payment</option>
                            <option value="Invoice">Invoice</option>
                            <option value="Other">Other / Custom Note</option>
                        </select>
                    </div>
                    <div class="col-md-8">
                        <input type="text" class="form-control rounded-3" id="remark_custom" name="remark_custom" placeholder="Optional reference or notes">
                    </div>
                </div>
            </div>

            <hr class="my-4 text-muted">
            <button type="submit" class="btn btn-success rounded-pill px-4 shadow-sm fw-semibold" id="btn_submit">
                <i class="fas fa-save me-2"></i>Save Payment
            </button>
            <a href="{{ url_for('routes.view_transactions') }}" class="btn btn-outline-secondary rounded-pill px-4 ms-2 fw-semibold">Cancel</a>
        </form>
    </div>
</div>

<script>
    let currentMode = 'payment';

    function syncInvoiceNumber(val) {
        document.getElementById('invoice_number').value = (val || '').trim();
    }

    function switchTransactionMode(mode) {
        currentMode = mode;
        const pageHeading = document.getElementById('page_heading');
        const pageSubheading = document.getElementById('page_subheading');
        const paymentSection = document.getElementById('payment_fields_section');
        const invoiceSection = document.getElementById('invoice_fields_section');
        const btnSubmit = document.getElementById('btn_submit');
        const remarkType = document.getElementById('remark_type');
        const invAmtInput = document.getElementById('invoice_amount');
        const payAmtInput = document.getElementById('payment_amount');
        const invNumPay = document.getElementById('invoice_number_pay');
        const invNumInv = document.getElementById('invoice_number_inv');
        const hiddenInv = document.getElementById('invoice_number');

        if (mode === 'payment') {
            pageHeading.innerHTML = '<i class="fas fa-money-bill-wave text-success me-2"></i>Record Customer Payment';
            pageSubheading.innerText = 'Directly record a payment received from a customer without requiring an invoice.';
            paymentSection.style.display = 'block';
            invoiceSection.style.display = 'none';
            btnSubmit.innerHTML = '<i class="fas fa-save me-2"></i>Save Payment';
            btnSubmit.className = 'btn btn-success rounded-pill px-4 shadow-sm fw-semibold';
            remarkType.value = 'Payment';

            // Payment mode validation constraints
            invAmtInput.value = '0.00';
            invAmtInput.min = '0';
            invAmtInput.removeAttribute('required');
            invNumInv.removeAttribute('required');

            payAmtInput.min = '0.01';
            payAmtInput.setAttribute('required', 'required');
            
            hiddenInv.value = (invNumPay.value || '').trim();
        } else {
            pageHeading.innerHTML = '<i class="fas fa-file-invoice text-primary me-2"></i>Issue New Invoice';
            pageSubheading.innerText = 'Create a new customer invoice with optional immediate payment.';
            paymentSection.style.display = 'block';
            invoiceSection.style.display = 'block';
            btnSubmit.innerHTML = '<i class="fas fa-save me-2"></i>Save Invoice';
            btnSubmit.className = 'btn btn-primary rounded-pill px-4 shadow-sm fw-semibold';
            remarkType.value = 'Invoice';

            // Invoice mode validation constraints
            invAmtInput.min = '0.01';
            invAmtInput.setAttribute('required', 'required');
            invNumInv.setAttribute('required', 'required');

            payAmtInput.min = '0';
            payAmtInput.removeAttribute('required');
            if (!payAmtInput.value || payAmtInput.value === '') {
                payAmtInput.value = document.getElementById('initial_payment_amount').value || '0.00';
            }
            
            hiddenInv.value = (invNumInv.value || '').trim();
        }
    }

    function syncInvoicePaymentAmount(val) {
        document.getElementById('payment_amount').value = val || '0.00';
    }

    function handleCustomerChange(val) {
        const div = document.getElementById('new_customer_name_div');
        const input = document.getElementById('new_customer_name');
        if (val === '___OTHER___') {
            div.style.display = 'block';
            input.required = true;
            input.focus();
        } else {
            div.style.display = 'none';
            input.required = false;
        }
    }

    function handleSalespersonChange(val) {
        const div = document.getElementById('new_salesperson_name_div');
        const input = document.getElementById('new_salesperson_name');
        if (val === '___OTHER___') {
            div.style.display = 'block';
            input.required = true;
            input.focus();
        } else {
            div.style.display = 'none';
            input.required = false;
        }
    }

    function toggleRemarkCustom(val) {
        const customInput = document.getElementById('remark_custom');
        if (val === 'Other') {
            customInput.placeholder = 'Enter custom details or reference notes...';
            customInput.focus();
        } else {
            customInput.placeholder = 'Optional reference or notes';
        }
    }

    // Intercept form submit to ensure unified fields are properly assigned
    document.getElementById('tx_form').addEventListener('submit', function(e) {
        const hiddenInv = document.getElementById('invoice_number');
        if (currentMode === 'payment') {
            hiddenInv.value = document.getElementById('invoice_number_pay').value.trim();
            document.getElementById('invoice_amount').value = '0.00';
            document.getElementById('invoice_amount').min = '0';
            document.getElementById('invoice_amount').removeAttribute('required');
            document.getElementById('invoice_number_inv').removeAttribute('required');
        } else {
            hiddenInv.value = document.getElementById('invoice_number_inv').value.trim();
            const payAmt = document.getElementById('payment_amount');
            if (!payAmt.value || payAmt.value === '') {
                payAmt.value = '0.00';
            }
        }
    });

    // Optional invoice lookup (purely informational, never locks form or blocks payments)
    document.getElementById('invoice_number_pay').addEventListener('blur', function() {
        const invNum = this.value.trim();
        const feedback = document.getElementById('invoice_feedback_pay');
        if (!invNum) {
            feedback.style.display = 'none';
            return;
        }

        fetch(`/api/invoice_details/${encodeURIComponent(invNum)}`)
            .then(res => res.json())
            .then(data => {
                if (data.exists) {
                    feedback.innerHTML = `<i class="fas fa-info-circle me-1"></i>Found reference invoice for <strong>${data.customer}</strong> (Balance: AED ${data.remaining_balance.toFixed(2)})`;
                    feedback.style.display = 'block';
                } else {
                    feedback.style.display = 'none';
                }
            })
            .catch(err => {
                feedback.style.display = 'none';
            });
    });

    // Default init
    document.addEventListener('DOMContentLoaded', function() {
        if (!document.getElementById('date').value) {
            document.getElementById('date').valueAsDate = new Date();
        }
        
        // Check query param if requested directly
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('type') === 'invoice') {
            document.getElementById('mode_invoice').checked = true;
            switchTransactionMode('invoice');
        } else {
            switchTransactionMode('payment');
        }
    });
</script>
{% endblock %}
